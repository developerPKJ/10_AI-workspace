spring.application.name=AI_Local_Project

server.servlet.context-path=/ai
server.port=8007

# View Resolver 설정
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 로컬 LLM 설정 (Ollama 설정)
# Ollama 서버 주소 셋팅 (생략 시 기본값은 http://localhost:11434)
spring.ai.ollama.base-url=http://localhost:11434

# 사용할 LLM 모델명
# 반드시 사전에 모델을 다운로드 (ollama pull) 해야 함
# 당연히 다운로드한 모델명과 동일하게 셋팅해야함
# spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.chat.model=exaone3.5
# 국내 모델이 확실히 한국어 응답 품질이 뛰어나다!!
# 만약 해외 모델을 사용하고 싶다면, System Prompt 상으로 "한국어로만 대답" 이라는 조항을 넣어준다.